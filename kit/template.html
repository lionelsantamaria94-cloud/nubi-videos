<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--green:#245545;--deep:#123629;--lime:#58cc02;--gold:#ffc800;--cream:#f8f6ef;--ink:#17352a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:Inter,sans-serif;color:var(--ink)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--cream)}

</style></head>
<body><div id="stage"></div>

/* ===== Hook ===== */
{const s=scene('#f8f6ef',tHook,tTitle-.15);
 (S.emojis||['🍳','🥔','🍚','🍅']).slice(0,8).forEach((e,i)=>{const d=el('div','abs',null,s,`font-size:${110+R()*50}px;left:${80+(i%4)*250+R()*50}px;top:${i<4?170+R()*110:1500+R()*150}px`);const inn=el('div',null,e,d);A(d,[{transform:'scale(0) rotate(-30deg)'},{transform:'none'}],tHook+.1+i*.06,.6,SPRING);floatLoop(inn,tHook+.8,14,2+R())});

 if(S.hook_sub){const sub=el('div','abs center',esc(S.hook_sub),s,'top:1200px;font-size:48px;font-weight:600;color:#5d6b63;padding:0 70px');A(sub,[{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'none'}],tHook+1.4,.6)}

}
/* ===== Title ===== */
{const s=scene('radial-gradient(circle at 50% 38%,#2f6b56,#123629 72%)',tTitle-.15,tSteps-.15);
 const ring=el('div','abs',null,s,'left:540px;top:640px;width:10px;height:10px;border-radius:50%;background:#58cc02');A(ring,[{transform:'scale(0)',opacity:.9},{transform:'scale(160)',opacity:0}],tTitle,1.1,'ease-out','both');
 const k=el('div','abs center',null,s,'top:210px');el('span','pill',esc(S.kicker||'RECETA'),k,'background:rgba(255,255,255,.12);color:#ffc800;font-size:38px;letter-spacing:.12em;border:2px solid rgba(255,255,255,.25)');pop(k,tTitle+.15);

 A(pw,[{transform:'scale(0) rotate(-120deg)'},{transform:'none'}],tTitle+.2,.9,SPRING);floatLoop(pl,tTitle+1.1,12,2.6);
 const ti=el('div','abs center disp',null,s,`top:930px;font-size:${fit(S.title,128,14)}px;color:#ffc800;padding:0 50px`);words(ti,S.title,tTitle+.45,.1);
 if(S.subtitle){const sb=el('div','abs center',esc(S.subtitle),s,'top:1180px;font-size:50px;font-weight:600;color:#cfe6da;padding:0 80px;line-height:1.3');A(sb,[{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'none'}],tTitle+.9,.6)}
 const meta=el('div','abs center',null,s,'top:1400px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:0 60px');
 (S.meta||[]).slice(0,3).forEach((m,i)=>{const p=el('span','pill',esc(m),meta,'background:#fff;color:#123629;font-size:38px');pop(p,tTitle+1.2+i*.12)});

/* ===== Steps ===== */
{const s=scene('linear-gradient(180deg,#f8f6ef,#eef6e6)',tSteps-.15,tReward-.15);

 steps.forEach((st,i)=>{const a=tSteps+i*T.step,b=a+T.step;
   A(fill,[{width:`${i/steps.length*100}%`},{width:`${(i+1)/steps.length*100}%`}],a+.1,.6,EO,i?'forwards':'both');
   const card=el('div','abs',null,s,'left:60px;right:60px;top:470px;height:1100px');
   A(card,[{opacity:0,transform:'translateX(260px)'},{opacity:1,transform:'none'}],a,.55,EO,'both');if(i<steps.length-1)A(card,[{opacity:1,transform:'none'},{opacity:0,transform:'translateX(-260px)'}],b-.25,.3,EI,'forwards');
   const ew=el('div','plate',`<span style="font-size:170px;line-height:1">${st.emoji||'✨'}</span>`,card,'left:290px;top:40px;width:380px;height:380px');pop(ew,a+.15,.7);

 });

 const top=el('div','abs center disp',esc(S.reward_title||'Cocínalo en Nubi'),s,'top:250px;font-size:84px;color:#5b3b00;padding:0 60px');A(top,[{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],tReward+.05,.5);
 const xp=el('div','abs center disp',null,s,'top:470px;font-size:250px;color:#fff;text-shadow:0 12px 0 #d08a00,0 30px 50px rgba(150,80,0,.35)');xp.innerHTML='+<span>0</span><span style="font-size:120px"> XP</span>';
 pop(xp,tReward+.2,.7);const xpn=xp.querySelector('span');const X=S.xp||120;counters.push({e:xpn,fn:tt=>{const k=Math.min(1,Math.max(0,(tt-tReward-.3)/1.1));return Math.round(X*(1-Math.pow(1-k,3)))}});

/* ===== End card ===== */
{const s=scene('radial-gradient(circle at 50% 38%,#2f6b56,#0f2d22 75%)',tEnd-.15,null);

 const n=el('div','abs center disp',null,s,'top:800px;font-size:200px;color:#fff');words(n,'Nubi',tEnd+.35,.1);
 const t2=el('div','abs center disp',null,s,'top:1030px;font-size:88px;color:#ffc800');words(t2,'¿Qué cocino hoy?',tEnd+.6,.08);
 const u=el('div','abs center',null,s,'top:1250px');el('span','pill',esc(S.cta||'👉 Pruébala gratis · link en la bio'),u,'background:#fff;color:#123629;font-size:48px;box-shadow:0 12px 0 rgba(0,0,0,.25)');pop(u,tEnd+1.0,.7);
 const g=el('div','abs center','Gratis · Web y <span style="color:#9be36b">Android</span> 🤖',s,'top:1420px;font-size:44px;font-weight:700;color:#cfe6da');A(g,[{opacity:0},{opacity:1}],tEnd+1.4,.6);

el('div','grain',null,stage);

seek(0);
</script></body></html>
